# CI de @milpa/design — el quality floor es inescapable (HANDOFF T3).
# Sin instalación: los verificadores son node puro, cero dependencias.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` too: a pull request's title and body become its squashed commit, so the message gate
    # reads them again whenever they change.
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read
  pull-requests: read

# One run per pull request. A newer event (a push, an edit) replaces the run it makes stale, so an
# older run can never finish after it and leave a verdict about a text that is no longer there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # The family's one copy of this gate lives in getmilpa/devtools. It reads this pull request's
      # title, body and commits (or the commits a push added) and needs nothing from the checkout.
      - name: Message gate (a commit speaks for its author alone)
        uses: getmilpa/devtools/.github/actions/message-gate@main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm test = triple gate:
      #   1. contraste WCAG AA (135 pares)
      #   2. gobernanza del molde (token-purity, contratos válidos y coherentes)
      #   3. drift: dist/ debe coincidir con lo que genera tokens/milpa-tokens.json
      #      (build-tokens.mjs --check — si editaste el JSON, corré npm run build)
      - run: npm test
